name: Deploy field site to Pages
# Reliable static deploy via GitHub Actions, replacing the legacy branch-based
# (Jekyll) Pages builder, which intermittently fails during GitHub Pages
# incidents even for a plain static site with .nojekyll. Actions Pages uploads
# the artifact and deploys directly, unaffected by the legacy builder's health.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts | any(.name == "github-pages" and (.expired | not))' | grep -qx true; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
