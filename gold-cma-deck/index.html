<style>

*{box-sizing:border-box;margin:0}
body{background:#eef0f3;font-family:Inter,system-ui,sans-serif;color:var(--navy-darkest)}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.deck{position:relative;width:1440px;height:900px;background:#fff;
      box-shadow:0 8px 40px rgba(0,41,75,.18);overflow:hidden;transform-origin:center center;flex-shrink:0}
.slide{position:absolute;inset:0;padding:64px 84px 88px;opacity:0;pointer-events:none;
       transition:opacity .25s ease;display:flex;flex-direction:column}
.slide.active{opacity:1;pointer-events:auto}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--navy);font-weight:600;margin-bottom:10px}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:34px;line-height:1.22;font-weight:700;margin-bottom:26px;max-width:1220px}

.sub{font-size:17px;color:var(--gray-500);max-width:980px;line-height:1.5}
.body{flex:1;display:flex;gap:36px;min-height:0}
.col{flex:1;min-width:0}
p,li{font-size:16.5px;line-height:1.52}
ul{padding-left:20px;display:flex;flex-direction:column;gap:10px}
b{color:var(--navy-darkest)}
.callout{background:var(--bg-blue);border-left:4px solid var(--navy);padding:14px 18px;border-radius:0 8px 8px 0;font-size:15.5px;line-height:1.5;margin-top:16px}
.callout.warn{background:#fdf0f6;border-color:var(--magenta)}
.callout.good{background:var(--bg-teal);border-color:var(--teal)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--navy-darkest);color:#fff;padding:7px 10px;text-align:left;font-weight:600;font-size:13px}
td{padding:6px 10px;border-bottom:1px solid var(--gray-100)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.hl td{background:#fbf6e9;font-weight:600}
.pos{color:var(--teal);font-weight:600}.neg{color:var(--magenta);font-weight:600}
.bar{height:15px;background:var(--navy);border-radius:2px;display:inline-block;vertical-align:middle}
.bar.gold{background:var(--gold)} .bar.neg{background:var(--magenta)}
.foot{position:absolute;left:84px;right:84px;bottom:26px;display:flex;justify-content:space-between;

.nav{position:fixed;right:18px;bottom:14px;font-size:13px;color:var(--gray-500);z-index:5}
a{color:var(--navy)}
.links{display:flex;gap:22px;flex-wrap:wrap;margin-top:34px;font-size:15px}
.kpis{display:flex;gap:22px;margin:26px 0 6px}

// 4 — why returns space
() => `
  <div class="eyebrow">Model selection — gold</div>
  <h1>We model gold in returns space because the fair-value level anchor broke in 2022 and now permanently reads gold as 40–50% rich</h1>
  <div class="body"><div class="col">
    <ul>
      <li>A levels model anchors price to the real rate. <b>Real yields rose after 2022 and gold roughly doubled anyway</b> — the model's residual is not noise, it is the official-sector regime change.</li>
      <li>A levels spine forces that broken component to contaminate the stable ones. <b>Returns space quarantines it</b>: the dollar and real-rate sensitivities stay stable across regimes, and the structural bid moves into an explicit drift term we can reason about separately.</li>
      <li>Each rejected family still contributes a part: the Golden Constant becomes the <b>+1.0–1.3% real floor</b> on the drift; regime-switching becomes a <b>targeted high-inflation interaction</b>; official-sector demand becomes <b>the residual itself</b>; wealth-share pool sizing is what Bitcoin later borrows.</li>

    <div class="callout good">One criterion did the selecting: a 20-year horizon. It is long enough to break every fitted level and expose every reflexive metric — only a mechanism-driven returns model survives it.</div>

() => `

  <div class="body"><div class="col">

      <li>We do <b>not</b> extrapolate the sample intercept — that would carry a specific window of central-bank buying forward as a constant.</li>
      <li>The drift is anchored between two named reference points: the centuries-long <b>Golden Constant floor (+1.0–1.3% real)</b> and the post-2022 official-sector bid the intercept measures — the centre is a stated structural choice, bounded by priors.</li>
      <li>Money-supply growth is no help in timing it: gold-vs-M0/M1/M2 YoY correlations are ≈0 at every horizon; gold/M0 sits at its 50th historical percentile. <b>Debasement works over 55 years and is useless as a signal.</b></li>
    </ul>

      <li>On realized data Bitcoin is <b>speculative and equity-correlated</b> (gold correlation ≈ 0, equity correlation positive and rising) — a gold-style regression is the wrong frame.</li>
      <li>Every alternative fails at 20 years: on-chain metrics take price as an input, stock-to-flow is a spurious regression, options recover weeks-horizon objects, and <b>flow-multiplier models price the plumbing, not the water</b> — in an efficient market a repricing needs zero net inflow.</li>
      <li>The share equation reduces everything unknowable to <b>one named parameter S</b>, disciplined by the gold CMA's own pool.</li>

const TITLES = ["Cover","Review","Street","Returns space","Two models","Out of sample","The drift","Bitcoin","Extremes","Portfolio"];
const deck = document.getElementById("deck");
SLIDES.forEach((fn, i) => {
  const s = document.createElement("div");
  s.className = i === 0 ? "slide active cover" : "slide";
  s.innerHTML = fn(i) + `<div class="foot"><span>Gold &amp; Bitcoin CMA — evidence deck · By JAOD &amp; (mainly) Claude</span><span>${i+1} / ${SLIDES.length}</span></div>`;
  deck.appendChild(s);
});
let cur = 0;
const nodes = [...deck.querySelectorAll(".slide")];
function show(i){
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  nodes.forEach((n, j) => n.classList.toggle("active", j === cur));
  if (W.location) W.location.hash = "#" + (cur + 1);
  document.getElementById("nav").textContent = `${TITLES[cur]} — ${cur+1}/${SLIDES.length} · ←/→`;
}
// interaction wiring is guarded so a headless validator (no window APIs) still
// executes the full render above; browsers get the real behavior
const W = (typeof window !== "undefined") ? window : {};
const on = (t, f) => { if (typeof W.addEventListener === "function") W.addEventListener(t, f); };
on("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") show(cur + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") show(cur - 1);
});
if (typeof deck.addEventListener === "function")
  deck.addEventListener("click", e => { if (!e.target.closest("a")) show(cur + 1); });
function fitDeck(){
  const m = 24;
  const iw = W.innerWidth || 1440, ih = W.innerHeight || 900;
  const s = Math.min((iw - m*2) / 1440, (ih - m*2) / 900, 1);
  deck.style.transform = `scale(${s})`;
}
on("resize", fitDeck);
fitDeck();
show(((W.location && parseInt(W.location.hash.slice(1))) || 1) - 1);
</script>
