<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-src blob:; base-uri 'none'; form-action 'none'">
<title>Protected report archive</title>
<link rel="stylesheet" href="style.css">
<main>
  <section id="gate">
    <span class="eyebrow">PRIVATE READING COPY</span>
    <h1>Protected report archive</h1>
    <p>Enter the access key to open and download your report. Decryption happens in your browser.</p>
    <form id="unlock">
      <label for="key">Access key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" required>
      <button id="submit" type="submit">Unlock report</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section id="reader" hidden>
    <header>
      <div><strong>AI Macro Monitor · 16 October 2026</strong><p>Saved snapshot. Evercore describes weekly updates to the original monitor; this copy does not refresh.</p></div>
      <nav aria-label="Report actions"><a id="download" download="evercore-ai-macro-2026-10-16.html">Download HTML</a><button id="lock" type="button">Lock</button></nav>
    </header>
    <iframe id="report" title="AI Macro Monitor report" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
  </section>
</main>
<script src="app.js"></script>
</html>
